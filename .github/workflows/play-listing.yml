name: Play Store Listing

# The store listing, published from the repository rather than retyped into the Console.
#
# Separate from `release.yml` on purpose. Listing text changes on a different clock from releases —
# a typo fixed in the Turkish description is not a reason to publish a build — and the two failures
# are different too: a bad release stops a version, a bad listing is live in fourteen languages
# until somebody notices.
#
# Runs from `main`, because `main` is the released state of the app and the listing describes what
# is released. A change to the text lands on `develop` with everything else and reaches the store
# when the release does.

on:
  push:
    branches: [main]
    paths:
      - fastlane/**
      # Release notes are not listing text: they are keyed by versionCode and go up beside the AAB
      # in google-play.yml. Excluded because /release writes one per locale in the same commit that
      # bumps the version, and both workflows firing on that push is a race — this one would look
      # for a release the other has not created yet.
      - "!fastlane/metadata/android/*/changelogs/**"
      - Gemfile
      - .github/workflows/play-listing.yml
  pull_request:
    paths:
      - fastlane/**
      - "!fastlane/metadata/android/*/changelogs/**"
      - Gemfile
      - .github/workflows/play-listing.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate against Play without changing anything
        required: false
        default: false
        type: boolean

jobs:
  listing:
    name: Upload listing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # An app whose entire promise is that it collects nothing has no business sending usage
      # statistics from its own release pipeline.
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      # Text first, in every locale, before any of it reaches the store. The check runs without a
      # versionCode here: release notes belong to a release, and this workflow does not make one.
      - name: Validate store metadata
        run: tools/check_store_metadata.sh

      # No versionCode is read here, deliberately. supply needs a *release* on the internal track to
      # attach the listing edit to (see the Fastfile), but it does not need to be told which one:
      # given no version code it takes the release the track actually has. Reading the number out of
      # app/build.gradle.kts instead asks the store for the repository's version, and the two drift
      # every time main is bumped without a listing change — which is what kept this workflow green
      # and silent while it uploaded nothing.
      - uses: ruby/setup-ruby@v1
        with:
          # The Gemfile pins fastlane; Ruby itself only has to be recent enough to run it. No
          # bundler-cache, because that needs a Gemfile.lock and this project deliberately has none
          # — see the Gemfile for why.
          ruby-version: "3.3"

      - name: Install fastlane
        run: bundle install --jobs 4 --retry 3

      # On a pull request there is nothing to publish yet: this validates the same payload through
      # Play's own API, which is the only thing that catches a locale code Play does not accept or
      # text it measures differently from the local check.
      #
      # Skipped for a pull request from a fork, which cannot see the secret. The repository takes no
      # outside pull requests yet (AGENTS.md, licence) — when it does, this is one of the places
      # that has to keep working without a credential.
      - name: Validate listing against Play
        id: validate
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        # Blocking, as of 2026-08-31. This step spent its first four days as continue-on-error,
        # because Play refuses a listing edit for a track with no release on it and a red cross on
        # every pull request that touches a description is how people learn to stop reading the
        # crosses. The internal track has a release now and this validates against Play cleanly, so
        # the exemption is spent: from here a failure is a real one and should stop the pull request.
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android listing dry_run:true

      # Every failure here is a failure. There was once an exception — before the first AAB existed
      # the internal track had no release for supply to attach a listing edit to, so "no release"
      # was reported and the run went green — and that exception is why all three of this
      # workflow's pushes to main reported success and uploaded nothing: the escape hatch swallowed a
      # genuine error (a version code that did not match the track) and then a second one behind it
      # (the service account could not edit an unpublished app's draft). The track has a release now. A workflow that
      # cannot tell "nothing to do" from "did not work" is worse than one that just fails.
      - name: Upload listing to Play
        id: upload
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          set +e
          OUTPUT=$(bundle exec fastlane android listing 2>&1)
          STATUS=$?
          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Real failures, but ones with a one-click fix that no stack trace mentions.
          #
          # Two different boxes produce this same 403, and the obvious one is the wrong one. While
          # Larova is an unpublished draft its listing and app details are draft content, so the
          # account needs "Edit and delete app drafts" as well as "Manage store presence" — with
          # only the latter, releases go through and every listing edit is refused.
          if printf '%s' "$OUTPUT" | grep -q "caller does not have permission"; then
            echo "::error::The service account can reach the app and the track but not the store listing. In the Play Console under Users and permissions, for Larova, tick BOTH Edit and delete app drafts (German: App-Entwuerfe bearbeiten und loeschen) and Manage store presence (older Consoles: Edit store listing, pricing and distribution), then re-run. The draft one is the easy one to miss and is required until the app's first release is published."
          fi

          if printf '%s' "$OUTPUT" | grep -q "Could not find release for version code"; then
            echo "::error::The internal track has no release with that version code. This lane passes none, so supply takes the track's own release — if you see this, a version_code was supplied somewhere, or the track holds no release at all (upload the first AAB by hand, docs/release-setup.md 3.7)."
          fi

          if printf '%s' "$OUTPUT" | grep -q "More than one release found in this track"; then
            echo "::error::The internal track holds more than one release, so supply cannot pick one. Re-run this workflow and pass the version code you mean, or tidy the track in the Console."
          fi

          exit "$STATUS"

      - name: Validate listing on request
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android listing dry_run:true

      # Said in words rather than left as a fastlane stack trace, on the pull-request path and on
      # any genuine failure.
      - name: Explain the failure
        if: failure() || steps.validate.outcome == 'failure'
        run: |
          {
            echo "### Listing not uploaded"
            echo
            echo "If this failed with **The caller does not have permission**, the release was found"
            echo "and the listing call was refused: the service account holds release permissions"
            echo "but not the ones covering store presence. Staging the text succeeds and only the"
            echo "commit is rejected, so the log looks like a successful upload right up to its"
            echo "last line."
            echo
            echo "In the Play Console, under *Users and permissions*, open Larova and tick **both**"
            echo "*Edit and delete app drafts* and *Manage store presence* — older Consoles call the"
            echo "second one *Edit store listing, pricing and distribution*. The first is the one"
            echo "that gets missed: while the app is an unpublished draft its listing and app"
            echo "details count as draft content, so store presence on its own is refused and only"
            echo "release calls go through. Nothing needs rebuilding; the listing upload reads the"
            echo "repository, not the release."
            echo
            echo "If it failed with **Could not find release for version code**, the internal track"
            echo "has no release at all. \`fastlane supply\` attaches a listing edit to a release"
            echo "even when it uploads only text, so it cannot publish the listing of an app that"
            echo "has never shipped. Upload the first AAB by hand (docs/release-setup.md §3.7),"
            echo "then re-run this workflow."
            echo
            echo "If it failed with **More than one release found in this track**, supply cannot"
            echo "choose between them. Tidy the track in the Console, or dispatch this workflow"
            echo "again once it can."
          } >> "$GITHUB_STEP_SUMMARY"

      # The edit is committed but not submitted: a new app whose first release has not been reviewed
      # cannot have changes sent for review through the API, and fourteen languages of text going
      # live unattended is not something to automate on the way to a first test release either.
      - name: Say what is left to do
        if: steps.upload.outputs.uploaded == 'true'
        run: |
          {
            echo "### Listing uploaded"
            echo
            echo "The text and any images in \`fastlane/metadata/android\` are now on the Play"
            echo "Console entry for \`app.larova\`, as a committed edit that has **not** been sent"
            echo "for review. Open the Console and press *Send for review* to publish it."
          } >> "$GITHUB_STEP_SUMMARY"
