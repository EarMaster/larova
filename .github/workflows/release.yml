name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Tag, build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.out.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check app module ready
        id: ready
        run: echo "ready=$([ -f app/build.gradle.kts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Read version
        if: steps.ready.outputs.ready == 'true'
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          SHA=$(git rev-parse --short HEAD)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_base=larova-v${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.ready.outputs.ready == 'true'
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' | awk 'NR==1{p=1} p')
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'

      # The upload key is PKCS12 (docs/release-setup.md §1); the extension here is cosmetic, since
      # the Gradle signingConfig names the store type explicitly rather than inferring it.
      #
      # An empty or truncated secret decodes to an empty file, which would otherwise reach Gradle as
      # a keystore it cannot open — a confusing failure several minutes into the build. Checked here
      # instead, where the fix is obviously "re-set the secret".
      - name: Decode keystore
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.p12
          if [ ! -s keystore.p12 ]; then
            echo "::error::KEYSTORE_BASE64 decoded to an empty file. Re-set the secret — see docs/release-setup.md §2."
            exit 1
          fi

      - name: Build signed APK and AAB
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          # Absolute. The Gradle side resolves a relative path from the repository root now, but a
          # signing key found by two different rules is a key that goes missing under the third.
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Play Console -> Monetise -> Licensing. A public key, so unlike the four above it is not
          # a secret; it is kept as one only so it lives beside them. Absent, PurchaseVerifier
          # rejects every receipt and the paid tiles stay locked for everyone who bought them.
          LAROVA_LICENSING_KEY: ${{ secrets.LICENSING_KEY }}
        # reportSigning first: it says in the log whether this build will be signed, before the
        # twenty minutes that produce something Play would refuse.
        #
        # Two invocations, because the two artifacts are not the same app. The AAB is what Play
        # sells, so it keeps the paid tier and needs the licensing key. The APK attached to the
        # GitHub Release has no store behind it and ships unlocked: Play Billing cannot transact for
        # an app Play did not install, and the licence lets anybody rebuild without the check in five
        # minutes anyway, so a crippled sideload build would buy nothing and cost goodwill. See
        # docs/technical-notes.md §7.
        run: |
          ./gradlew reportSigning bundleRelease
          ./gradlew assembleRelease -Plarova.paidTier=false

      # AGP names an unsigned APK `app-release-unsigned.apk`, so a signing config that did not take
      # effect shows up here as a `mv` that cannot find its source — after the tag has already been
      # pushed. Said plainly instead, because the tag is the part that is awkward to undo.
      - name: Rename artifacts
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          BASE="${{ steps.version.outputs.artifact_base }}"
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$APK" ]; then
            echo "::error::$APK is missing. An unsigned build writes app-release-unsigned.apk instead, and Play refuses unsigned uploads — check KEYSTORE_PATH reached Gradle (see docs/release-setup.md §1)."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          mv "$APK" "app/build/outputs/apk/release/${BASE}.apk"
          mv "$AAB" "app/build/outputs/bundle/release/${BASE}.aab"

      # After the build, deliberately. Tagging first means a build that fails leaves a tag behind
      # that says a version was released when none was, and — because this workflow skips everything
      # when the tag already exists — the re-run after the fix does nothing at all. The first attempt
      # at v0.1.0 failed exactly that way.
      - name: Create and push tag
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        run: |
          BASE="${{ steps.version.outputs.artifact_base }}"
          EXTRA_ASSETS=""
          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            EXTRA_ASSETS="app/build/outputs/mapping/release/mapping.txt"
          fi
          printf '%s\n' "$RELEASE_BODY" > release_notes.txt
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.txt \
            "app/build/outputs/apk/release/${BASE}.apk" \
            "app/build/outputs/bundle/release/${BASE}.aab" \
            $EXTRA_ASSETS

      - name: Output tag for downstream
        if: steps.ready.outputs.ready == 'true' && steps.tag_check.outputs.exists == 'false'
        id: out
        run: echo "tag=${{ steps.version.outputs.tag }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Google Play
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/google-play.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      track: internal
    secrets: inherit
