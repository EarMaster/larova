name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  # Everything below is gated on the Gradle project existing. Larova is documentation and seed
  # files until M0 lands the wrapper (docs/implementation-plan.md), so these jobs currently pass
  # by skipping. That is deliberate: the workflows are in place first so the first build lands
  # into a repo that already checks it, rather than the other way round.
  #
  # `screenshots` is a second, narrower gate. Roborazzi goldens arrive in M3, and a job that
  # runs `--tests '*ScreenshotTest'` with no such test fails on "no tests found" — a permanent
  # warning nobody would read by the time it means something.
  detect:
    name: Detect Gradle project
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      screenshots: ${{ steps.check.outputs.screenshots }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check for the wrapper and for screenshot tests
        run: |
          echo "ready=$([ -f ./gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if find . -name '*ScreenshotTest*.kt' -not -path './build/*' | grep -q .; then
            echo "screenshots=true" >> "$GITHUB_OUTPUT"
          else
            echo "screenshots=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

  test:
    name: Unit Tests
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 14

  screenshots:
    name: Screenshots
    needs: detect
    if: needs.detect.outputs.ready == 'true' && needs.detect.outputs.screenshots == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      # Compares every screen against its committed golden. For Larova the matrix is wide by
      # design — every tile type across light, dark, night and 200 % font scale — because the
      # three appearance modes are resolved from colour tokens at runtime and a broken token
      # lookup is invisible in the light-mode screenshot everyone looks at.
      #
      # **A mismatch reports as a warning, not a failure** (`continue-on-error`). Two reasons:
      # goldens are baselines a maintainer *accepts* rather than a contract the code must
      # satisfy, so "the UI changed" is information rather than a defect; and a golden can differ
      # for reasons unrelated to the change under review — a Robolectric or Skia bump, a decoder
      # that rounds differently on another host — which turns a blocking job into one that gets
      # clicked past rather than read.
      #
      # The cost is real: a genuine visual regression merges green, and nothing else in CI looks
      # at pixels. If the warning below stops being read, make this blocking again rather than
      # keep a check nobody acts on.
      - name: Verify screenshots
        id: verify
        continue-on-error: true
        run: ./gradlew :app:verifyRoborazziDebug --tests '*ScreenshotTest'

      # Keyed on the step's outcome rather than `failure()`: with `continue-on-error` the job
      # never enters a failed state, so `failure()` would be false and the diffs would silently
      # never upload — which is the whole point of the job.
      - name: Upload screenshot diffs
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi/
          retention-days: 14

      # A green check with a warning buried in a collapsed log is indistinguishable from a green
      # check. The annotation surfaces on the PR itself.
      - name: Report the mismatch
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::warning title=Screenshot goldens do not match::The UI has changed against the committed goldens. Download the 'screenshot-diffs' artifact to see what moved."
          {
            echo "## Screenshot goldens do not match"
            echo
            echo "This is a **warning, not a failure** — the job is green and the merge is not blocked."
            echo
            echo "Download the \`screenshot-diffs\` artifact and look at the \`_compare\` images."
            echo "Each is an actual/expected/diff triptych."
            echo
            echo "- **Intended change?** Accept the new look, then commit the PNGs:"
            echo "  \`\`\`"
            echo "  ./gradlew :app:recordRoborazziDebug --tests '*ScreenshotTest'"
            echo "  \`\`\`"
            echo "- **Not intended?** It is a visual regression, and nothing else in CI will catch it."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      # Detekt runs alongside Lint per docs/technical-notes.md §9. Both in one job: they are
      # fast, and a PR that fails static analysis fails it for either reason.
      - name: Run lint and Detekt
        run: ./gradlew lint detekt

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            **/build/reports/detekt/
          retention-days: 14

  # The site only deploys from main, so without this a broken Liquid tag or a renamed SCSS
  # partial would reach the live page before anyone found out. Same build action pages.yml
  # uses, so a pass here means that workflow will get through too.
  #
  # Deliberately no `needs: detect` — the site has nothing to do with Gradle, which is also
  # why this is the one job in this file that actually runs today.
  pages:
    name: Pages Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/pages
          destination: ./_site

      # Do NOT assert that _site/CNAME exists — it never will. `github-pages build` forces
      # `exclude => ["CNAME"]` whenever the site's own `exclude` is Jekyll's default, so the
      # official builder strips it on purpose. The custom domain comes from the repository's
      # Pages settings, not from a file in the artifact.
      #
      # A local `jekyll build` does copy CNAME, having no such rule, so this difference does
      # not show up until it runs here.
      - name: Check the pages and stylesheet rendered
        run: |
          test -s ./_site/css/screen.css || { echo "::error::screen.css missing or empty — check the @import list in css/screen.scss"; exit 1; }
          test -f ./_site/index.html || { echo "::error::index.html missing"; exit 1; }
          test -f ./_site/privacy/index.html || { echo "::error::privacy page missing"; exit 1; }
          grep -q 'tiles' ./_site/index.html || { echo "::error::the tile grid did not render"; exit 1; }
          # The landing page's screenshots are generated (`StoreAssetTest` → `finishStoreAssets`)
          # and committed, so a missing one means somebody deleted the files rather than that the
          # page is wrong. Either way the page ships with broken images, which is worth failing on.
          for shot in $(grep -oE 'assets/screenshots/[A-Za-z0-9_]+\.png' ./_site/index.html | sort -u); do
            test -f "./_site/$shot" || { echo "::error::index.html references $shot, which is not in the built site"; exit 1; }
          done
          # Both pages must end up with a title. The layout has no literal <title> tag — it
          # comes from `{% seo %}` — so a static reading of the template cannot tell whether
          # one exists, and an accessibility linter reading the raw layout reports it missing
          # (WCAG 2.4.2). This asserts against the rendered output, which is the only place
          # the question has an answer.
          for f in ./_site/index.html ./_site/privacy/index.html; do
            grep -qE '<title>[^<]+</title>' "$f" || { echo "::error::$f rendered without a <title> — is {% seo %} still in the layout?"; exit 1; }
          done
          if grep -q '{%' ./_site/index.html ./_site/privacy/index.html; then echo "::error::unrendered Liquid tag left in a page"; exit 1; fi

      # The whole product claim is that nothing leaves the device, and this site hosts the
      # privacy policy that says so. A stylesheet or font pulled from a CDN would put a
      # visitor's IP in a third party's log and contradict the page it is styling — and
      # embedding Google Fonts has been held to breach the GDPR in Germany, the launch
      # market. Cheap to assert, so assert it rather than trusting review.
      - name: Check nothing loads from a third party
        run: |
          # Only *asset loads* are checked — a stylesheet, script, image, iframe or a CSS
          # url(). Two kinds of external URL are deliberately not matched, because neither
          # fetches anything:
          #   - anchors. Linking out to GitHub or to the GDPR text is normal, and a check
          #     that broke on the next prose link would get deleted rather than fixed.
          #   - <link rel="canonical"> and friends. jekyll-seo-tag emits a canonical link on
          #     every page, pointing at this site's own absolute URL. It is metadata for
          #     crawlers, not a request the browser makes.
          if grep -rInoE '<(link|script|img|iframe)[^>]+(href|src)="https?://[^"]+' ./_site --include='*.html' \
             | grep -vE 'rel="(canonical|alternate|author|license|me|prev|next)"'; then
            echo "::error::a page loads an asset over the network — inline or self-host it instead"
            exit 1
          fi
          if grep -rInoE 'url\(\s*['\''"]?https?:' ./_site --include='*.css'; then
            echo "::error::a stylesheet fetches something over the network — inline it as a data: URI instead"
            exit 1
          fi
          echo "no external asset loads"
