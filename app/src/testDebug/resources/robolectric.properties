# Shared configuration for every Robolectric test in this module.
#
# The plain framework Application, not Larova's own. `LarovaApplication.onCreate` starts Koin with
# the real graph — Room, DataStore, the media directory — and a screenshot test needs none of it:
# every screen here takes its state as a parameter, so the pictures are made from fixtures rather
# than from a database. Naming the class also stops a Koin instance leaking between test classes.
application=android.app.Application
#
# One below compileSdk, and deliberately. Robolectric's SDK 36 image wants a newer JDK than the
# Temurin 17 every workflow here pins, so it runs on a developer's JBR and throws on the CI runner
# — where goldens are recorded and verified. SDK 35 runs on 17, which makes the two the same
# platform. Raising this means raising CI's JDK first.
sdk=35
#
# NATIVE graphics is what makes a screenshot a screenshot. Without it Robolectric draws nothing
# and every golden is a blank bitmap of the right size.
graphicsMode=NATIVE
#
# A mid-size phone in portrait, spelled out rather than referenced so a golden's size cannot change
# under us when a library updates its idea of a current phone. Individual tests narrow or shorten
# this with `@Config(qualifiers = "+...")`; the store images replace it outright.
qualifiers=w411dp-h914dp-normal-long-notround-any-420dpi-keyshidden-nonav
