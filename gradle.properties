# Larova · build-wide Gradle settings.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# The Android numbers every module needs, in one place. Module build files read them through
# providers.gradleProperty(...), so raising a level is a one-line change rather than ten.
#
# minSdk 26 is the adaptive-icon floor. brand/ ships three adaptive layers and no legacy round
# icon, and Android 8.0 covers effectively every device still receiving Play updates.
larova.compileSdk=36
larova.targetSdk=36
larova.minSdk=26
larova.jvmTarget=17
